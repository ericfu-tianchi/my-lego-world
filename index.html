<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Lego World</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1f2124; --muted: #6a6e72; --paper: #f1f2ef; --line: rgba(31,33,36,.13); --brick: #c91a09; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  html, body { height: 100%; } body { margin: 0; overflow: hidden; font-family: Rubik, -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--paper) radial-gradient(120% 90% at 50% 38%, #f5f5f2 0%, #e6e7e3 58%, #d2d4cf 100%); -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; z-index: 2; pointer-events: none; } [hidden] { display: none !important; }
  .brand { top: 22px; left: 26px; display: flex; align-items: center; gap: 10px; } .brand .logo { width: 22px; height: 16px; border-radius: 3px; background: var(--brick); position: relative; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .brand .logo::before, .brand .logo::after { content: ""; position: absolute; top: -4px; width: 6px; height: 4px; border-radius: 2px 2px 0 0; background: var(--brick); } .brand .logo::before { left: 3px; } .brand .logo::after { right: 3px; }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; } .brand .pill { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
  .hint { top: 26px; right: 26px; font-size: 12px; color: var(--muted); }
  .switch { top: 64px; left: 26px; display: flex; gap: 6px; pointer-events: auto; } .switch button { font-size: 13px; padding: 7px 12px; } .switch button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .card { left: 26px; bottom: 26px; max-width: 460px; } .card h2 { font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 4px; } .card .sub { font-size: 14px; color: var(--muted); margin: 0 0 10px; } .card .stats { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .actions { right: 26px; bottom: 26px; display: flex; gap: 10px; align-items: center; pointer-events: auto; }
  button { font: inherit; font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.75); color: var(--ink); cursor: pointer; backdrop-filter: blur(8px); transition: transform .12s ease, background .12s ease; }
  button:hover { background: #fff; transform: translateY(-1px); } button.primary { background: var(--ink); color: #fff; border-color: var(--ink); } button:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }
  #fade { position: fixed; inset: 0; z-index: 4; background: #e9eae6; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  #labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .pin-label { position: absolute; left: 0; top: 0; padding: 6px 11px 7px; border-radius: 10px; background: rgba(255,255,255,.88); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(28,27,24,.08); font-size: 12px; line-height: 1.25; white-space: nowrap; text-align: left; transition: opacity .2s ease, box-shadow .15s ease; backdrop-filter: blur(6px); }
  .pin-label b { display: block; font-weight: 600; font-size: 13px; } .pin-label span { color: var(--muted); }
  .pin-label.hover, .pin-label:hover { box-shadow: 0 10px 28px rgba(28,27,24,.16); border-color: rgba(28,27,24,.3); transform-origin: bottom center; }
  @media (prefers-reduced-motion: reduce) { #fade, button, .pin-label { transition: none; } }
  .entrance { top: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; pointer-events: auto; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.7); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .entrance span { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 0 8px 0 6px; }
  .entrance button { font-size: 13px; padding: 6px 11px; border-radius: 8px; border-color: transparent; background: transparent; } .entrance button.on { background: var(--ink); color: #fff; }
  .step { top: 74px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 13px; color: var(--ink); background: rgba(255,255,255,.8); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-variant-numeric: tabular-nums; }
  #strength-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.6); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; } #strength { width: 110px; accent-color: var(--brick); }
</style></head>
<body>
<canvas id="c"></canvas>
<div class="hud brand"><div class="logo"></div><h1>My Lego World</h1></div>
<div class="hud hint" id="hint">Drag to orbit · Scroll to zoom · Shift-drag to pan</div>
<!-- the home is the globe; any set opens directly with ?scene=<id> (kyoto, singapore, sg-v4, kyoto-refined, tokyo, partsheet, trees) -->
<div id="labels"></div>
<div class="hud card" id="card-globe"><h2>Where I've been</h2><p class="sub">Every pin is a place I've visited. Pick one and watch it build itself from real LEGO parts.</p><div class="stats">2 places built · more on the way</div></div>
<div class="hud card" id="card-place"><h2 id="place-title">—</h2><p class="sub" id="place-sub"></p><div class="stats" id="place-stats"></div></div>
<div class="hud entrance" id="entrance" hidden><span>Entrance</span><button data-entrance="steps">A · Steps</button><button data-entrance="vortex">B · Vortex</button><button data-entrance="rubble">C · Rebuild</button><button id="btn-replay" aria-label="Replay the entrance">↻ Replay</button></div>
<div class="hud step" id="step" hidden>Step 1 / 36</div>
<div class="hud actions" id="actions"><button id="btn-globe">All places</button><label id="strength-wrap">Force <input id="strength" type="range" min="1" max="6" step="0.5" value="2.5"></label><button id="btn-rebuild" hidden>Rebuild</button><button id="btn-apart" class="primary">Take it apart</button></div>
<div id="fade"></div>
<script type="module" src="/src/app/main.ts"></script>
</body></html>
