<style>
  :root { --glass-bg: rgba(250,250,248,.56); --glass-blur: blur(28px) saturate(180%); --glass-edge: inset 0 0 0 .5px rgba(255,255,255,.7), inset 0 1px 0 rgba(255,255,255,.85), 0 0 0 .5px rgba(31,33,36,.1); --glass-shadow: 0 1px 2px rgba(28,27,24,.05), 0 8px 24px rgba(28,27,24,.08), 0 24px 56px rgba(28,27,24,.08); --ink: #1f2124; --muted: #6a6e72; --paper: #f1f2ef; --line: rgba(31,33,36,.13); --brick: #c91a09; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }

  html, body { height: 100%; } body { margin: 0; overflow: hidden; font-family: Rubik, -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--paper) radial-gradient(120% 90% at 50% 38%, #f5f5f2 0%, #e6e7e3 58%, #d2d4cf 100%); -webkit-font-smoothing: antialiased; }

  #intro { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; text-align: center; background: rgba(238,239,235,.55); backdrop-filter: blur(14px) saturate(120%); -webkit-backdrop-filter: blur(14px) saturate(120%); transition: opacity 1s cubic-bezier(.4,0,.2,1), backdrop-filter 1.2s cubic-bezier(.4,0,.2,1), -webkit-backdrop-filter 1.2s cubic-bezier(.4,0,.2,1); }

  #intro.leaving { opacity: 0; backdrop-filter: blur(0) saturate(100%); -webkit-backdrop-filter: blur(0) saturate(100%); pointer-events: none; } #intro.leaving .in { opacity: 0; transform: translateY(-18px) scale(.985); }
  #labels { transition: opacity .8s ease; } body.intro #labels, body.intro .hint { opacity: 0; } .brand { z-index: 6; }
  .brand.link { pointer-events: auto; cursor: pointer; } .brand.link:hover h1 { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  button { font: inherit; font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.75); color: var(--ink); cursor: pointer; backdrop-filter: blur(8px); transition: transform .12s ease, background .12s ease; }
  button:hover { background: #fff; transform: translateY(-1px); } button.primary { background: var(--ink); color: #fff; border-color: var(--ink); } button:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }
  #fade { position: fixed; inset: 0; z-index: 4; background: #e9eae6; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  #labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .pin-label { position: absolute; left: 0; top: 0; padding: 4px 8px 5px; border-radius: 7px; background: rgba(255,255,255,.88); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(28,27,24,.08); font-size: 10.5px; line-height: 1.2; white-space: nowrap; text-align: left; transition: opacity .2s ease, box-shadow .15s ease; backdrop-filter: blur(6px); }
  .pin-label b { display: block; font-weight: 600; font-size: 11.5px; } .pin-label span { color: var(--muted); }
  .pin-label.hover, .pin-label:hover { box-shadow: 0 10px 28px rgba(28,27,24,.16); border-color: rgba(28,27,24,.3); transform-origin: bottom center; }
  .pin-label.soon { padding: 3px 7px 4px; font-size: 10px; background: rgba(255,255,255,.78); } .pin-label.soon b { font-size: 11px; font-weight: 500; } .pin-label.soon span { opacity: .8; }
  .pin-label.next b::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #f8bb3d; margin-right: 5px; vertical-align: 1px; }
  .pin-label.asked span::after { content: " · Coming soon"; color: #b4691f; font-weight: 500; }
  .pin-label.lite { display: flex; align-items: baseline; gap: 6px; } .pin-label.lite b { display: inline; } .pin-label.lite em { font-style: normal; font-size: 10px; color: #b4691f; font-weight: 500; }

  @media (prefers-reduced-motion: reduce) { #fade, button, .pin-label { transition: none; } .pin-label.shake { animation: none; } }
  .entrance { top: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; pointer-events: auto; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.7); border: 1px solid var(--line); backdrop-filter: blur(8px); }
  .entrance span { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 0 8px 0 6px; }

  .step { top: 74px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 13px; color: var(--ink); background: rgba(255,255,255,.8); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-variant-numeric: tabular-nums; }

  @media (max-width: 640px) {

    .home-stats { bottom: calc(14px + env(safe-area-inset-bottom)); border-radius: 16px; } .home-stats > div { padding: 10px 14px; } .home-stats b { font-size: 22px; } .home-stats span { font-size: 11px; gap: 5px; white-space: nowrap; } .home-stats i { width: 7px; height: 7px; }

    .card { left: 12px; right: 12px; max-width: none; bottom: calc(76px + env(safe-area-inset-bottom)); } #card-place { padding: 11px 14px 10px; border-radius: 14px; } #card-place h2 { font-size: 19px; margin-bottom: 2px; } .card .sub { font-size: 12.5px; margin-bottom: 6px; } .card .stats { font-size: 11px; }
